<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet Louvansky Benjamin, raised in Newark and a Philadelphia Eagles fan.">
    <title>Louvansky Benjamin</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f3f7f6;
        color: #172b29;
        font-family: system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 42rem;
        padding: clamp(1.5rem, 5vw, 3rem);
        border-top: 6px solid #004c54;
        border-radius: 12px;
        background: white;
        box-shadow: 0 12px 40px rgb(0 76 84 / 8%);
      }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 6vw, 3rem); }
      p { margin: 0; font-size: 1.125rem; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Louvansky Benjamin</h1>
      <p>I was raised in Newark and I love the Philadelphia Eagles.</p>
    </main>
  </body>
</html>
